<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="1000" height="260" role="img" aria-label="Turn and conversation ids travel as baggage to a gateway inside the boundary and are removed before leaving it.">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5a6a73"/></marker>
<marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c15800"/></marker>
<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#fdf0e6"/><line x1="0" y1="0" x2="0" y2="6" stroke="#e8b48a" stroke-width="2"/></pattern></defs>
<style>
text{font-family:-apple-system,'Helvetica Neue',Arial,sans-serif;fill:#1c2b34;font-size:12.5px}
.mono{font-family:Menlo,'SF Mono',monospace;font-size:11px}
.sub{fill:#5a6a73;font-size:11.5px}
.small{font-size:11px;fill:#5a6a73}
.head{font-weight:600}
.title{font-weight:600;font-size:14.5px}
.box{fill:#f7f8fa;stroke:#8c979d}
.new{fill:#e8f2fc;stroke:#1f6fbf;stroke-width:1.5}
.card{fill:#ffffff;stroke:#e2e5ed}
.line{stroke:#8c979d;stroke-width:1.5;fill:none}
.lane{stroke:#e2e5ed;stroke-width:1}
.dash{stroke:#5a6a73;stroke-width:1.3;fill:none;stroke-dasharray:5 3}
.odash{stroke:#c15800;stroke-width:1.4;fill:none;stroke-dasharray:5 3}
.frame{fill:none;stroke:#8c979d;stroke-width:1.2;stroke-dasharray:4 3}
.bound{fill:#fbfcfd;stroke:#1f6fbf;stroke-width:1.3;stroke-dasharray:7 4}
.end{fill:#c15800}
.hatch{fill:url(#hatch);stroke:#c15800;stroke-width:1}
.lbl{fill:#1f6fbf;font-weight:600;font-size:11.5px}
.olbl{fill:#c15800;font-weight:600;font-size:11.5px}
</style>
<rect width="1000" height="260" fill="#ffffff"/>
<rect class="bound" x="10" y="20" width="580" height="226" rx="10"/>
<text class="lbl" x="24" y="40">The system's own boundary</text>
<rect class="new" x="30" y="70" width="190" height="84" rx="8"/>
<text class="head" x="44" y="94">Agent</text><text class="sub" x="44" y="114">turn span</text><text class="mono" x="44" y="134">gen_ai.turn.id=t-7f3a</text>
<rect class="box" x="380" y="70" width="190" height="84" rx="8"/>
<text class="head" x="394" y="94">Gateway</text><text class="sub" x="394" y="114">records the ids it receives</text><text class="sub" x="394" y="132">never creates a turn</text>
<path class="line" d="M220 112H378" marker-end="url(#arr)"/>
<text class="small" x="232" y="96">W3C baggage:</text><text class="mono" x="232" y="130">conversation.id</text><text class="mono" x="232" y="144">turn.id</text>
<rect class="box" x="720" y="70" width="250" height="84" rx="8"/>
<text class="head" x="734" y="94">Model provider</text><text class="sub" x="734" y="114">outside the boundary</text>
<path class="line" d="M570 112H718" marker-end="url(#arr)"/>
<text class="olbl" x="596" y="100">gen_ai entries</text><text class="olbl" x="596" y="130">removed</text>
<rect class="box" x="720" y="184" width="250" height="56" rx="8"/>
<text class="head" x="734" y="206">Other APIs, MCP servers</text><text class="sub" x="734" y="224">not on the configured list</text>
<path class="odash" d="M125 154V214H718" marker-end="url(#arro)"/>
<text class="olbl" x="300" y="208">gen_ai entries not added</text>
</svg>
