<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 544" width="1000" height="544" role="img" aria-label="Four trace shapes for one exchange.">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5a6a73"/></marker>
<marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c15800"/></marker>
<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#fdf0e6"/><line x1="0" y1="0" x2="0" y2="6" stroke="#e8b48a" stroke-width="2"/></pattern></defs>
<style>
text{font-family:-apple-system,'Helvetica Neue',Arial,sans-serif;fill:#1c2b34;font-size:12.5px}
.mono{font-family:Menlo,'SF Mono',monospace;font-size:11px}
.sub{fill:#5a6a73;font-size:11.5px}
.small{font-size:11px;fill:#5a6a73}
.head{font-weight:600}
.title{font-weight:600;font-size:14.5px}
.box{fill:#f7f8fa;stroke:#8c979d}
.new{fill:#e8f2fc;stroke:#1f6fbf;stroke-width:1.5}
.card{fill:#ffffff;stroke:#e2e5ed}
.line{stroke:#8c979d;stroke-width:1.5;fill:none}
.lane{stroke:#e2e5ed;stroke-width:1}
.dash{stroke:#5a6a73;stroke-width:1.3;fill:none;stroke-dasharray:5 3}
.odash{stroke:#c15800;stroke-width:1.4;fill:none;stroke-dasharray:5 3}
.frame{fill:none;stroke:#8c979d;stroke-width:1.2;stroke-dasharray:4 3}
.bound{fill:#fbfcfd;stroke:#1f6fbf;stroke-width:1.3;stroke-dasharray:7 4}
.end{fill:#c15800}
.hatch{fill:url(#hatch);stroke:#c15800;stroke-width:1}
.lbl{fill:#1f6fbf;font-weight:600;font-size:11.5px}
.olbl{fill:#c15800;font-weight:600;font-size:11.5px}
</style>
<rect width="1000" height="544" fill="#ffffff"/>
<g transform="translate(10,10)"><rect class="card" width="480" height="262" rx="10"/><text class="title" x="16" y="28">Exchange span is the trace root</text>
<rect class="new" x="16" y="62" width="384" height="22" rx="4"/>
<text x="24" y="77"><tspan class="head">exchange span</tspan><tspan class="sub" dx="8">interaction, invoke_agent, invocation</tspan></text>
<polygon class="end" points="400,64 409,73 400,82 391,73"/><text class="small" x="414" y="77">ends last</text>
<rect class="box" x="28" y="92" width="112" height="20" rx="4"/><text class="sub" x="36" y="106">model call</text>
<rect class="box" x="146" y="120" width="120" height="20" rx="4"/><text class="sub" x="154" y="134">tool call</text>
<rect class="box" x="272" y="148" width="122" height="20" rx="4"/><text class="sub" x="280" y="162">model call</text>
<path class="line" d="M16 184H400"/><text class="small" x="406" y="188">time →</text>
<text class="sub" x="16" y="212">Claude Code · Claude Agent SDK · Copilot CLI · Qwen Code · Droid</text>
<text class="sub" x="16" y="230">Mistral Vibe · Goose CLI · Google ADK (root has no GenAI attributes)</text>
<text class="sub" x="16" y="248">OpenAI Agents SDK bridge (root marked invoke_workflow)</text></g><g transform="translate(510,10)"><rect class="card" width="480" height="262" rx="10"/><text class="title" x="16" y="28">Exchange span below the trace root</text>
<rect class="box" x="16" y="62" width="30" height="22" rx="4"/>
<text x="54" y="77"><tspan class="mono">turn/start</tspan><tspan class="sub" dx="8">trace root, ends after about 12 ms</tspan></text>
<rect class="box" x="24" y="92" width="22" height="20" rx="4"/><text class="mono" x="54" y="106">op.dispatch.turn_input</text>
<rect class="new" x="32" y="120" width="368" height="22" rx="4"/>
<text x="40" y="135"><tspan class="mono" font-weight="600">session_task.turn</tspan><tspan class="sub" dx="8">the exchange span</tspan></text>
<polygon class="end" points="400,122 409,131 400,140 391,131"/><text class="small" x="414" y="135">ends last</text>
<rect class="box" x="44" y="150" width="340" height="20" rx="4"/><text class="sub" x="52" y="164">run_turn › sampling requests › …   194 to 328 spans</text>
<path class="line" d="M16 184H400"/><text class="small" x="406" y="188">time →</text>
<text class="sub" x="16" y="212">Codex CLI and SDKs</text></g><g transform="translate(10,282)"><rect class="card" width="480" height="262" rx="10"/><text class="title" x="16" y="28">Many exchanges in one trace</text>
<rect class="frame" x="16" y="62" width="440" height="22" rx="4"/>
<text x="24" y="77"><tspan class="head">trace root</tspan><tspan class="sub" dx="8">never exported, or one per conversation</tspan></text>
<rect class="new" x="28" y="94" width="190" height="20" rx="4"/><text class="sub" x="36" y="108">exchange 1</text>
<rect class="box" x="40" y="120" width="70" height="18" rx="4"/><rect class="box" x="116" y="120" width="90" height="18" rx="4"/>
<rect class="new" x="236" y="94" width="210" height="20" rx="4"/><text class="sub" x="244" y="108">exchange 2</text>
<rect class="box" x="248" y="120" width="90" height="18" rx="4"/><rect class="box" x="344" y="120" width="90" height="18" rx="4"/>
<path class="line" d="M16 184H400"/><text class="small" x="406" y="188">time →</text>
<text class="sub" x="16" y="212">Goose over ACP · OpenHands</text></g><g transform="translate(510,282)"><rect class="card" width="480" height="262" rx="10"/><text class="title" x="16" y="28">No exchange span</text>
<rect class="frame" x="16" y="62" width="130" height="36" rx="6"/><rect class="box" x="24" y="70" width="114" height="20" rx="4"/><text class="sub" x="32" y="84">model call</text>
<rect class="frame" x="156" y="104" width="140" height="36" rx="6"/><rect class="box" x="164" y="112" width="124" height="20" rx="4"/><text class="sub" x="172" y="126">tool call</text>
<rect class="frame" x="306" y="146" width="140" height="36" rx="6"/><rect class="box" x="314" y="154" width="124" height="20" rx="4"/><text class="sub" x="322" y="168">model call</text>
<text class="small" x="16" y="120">dashed box = trace</text>
<path class="line" d="M16 196H400"/><text class="small" x="406" y="200">time →</text>
<text class="sub" x="16" y="224">OpenCode (spans named after internal functions)</text></g>
</svg>
