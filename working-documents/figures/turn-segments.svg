<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 254" width="1000" height="254" role="img" aria-label="Approval inside the process keeps one segment; a runtime that ends the request creates two linked segments.">
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5a6a73"/></marker>
<marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c15800"/></marker>
<pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#fdf0e6"/><line x1="0" y1="0" x2="0" y2="6" stroke="#e8b48a" stroke-width="2"/></pattern></defs>
<style>
text{font-family:-apple-system,'Helvetica Neue',Arial,sans-serif;fill:#1c2b34;font-size:12.5px}
.mono{font-family:Menlo,'SF Mono',monospace;font-size:11px}
.sub{fill:#5a6a73;font-size:11.5px}
.small{font-size:11px;fill:#5a6a73}
.head{font-weight:600}
.title{font-weight:600;font-size:14.5px}
.box{fill:#f7f8fa;stroke:#8c979d}
.new{fill:#e8f2fc;stroke:#1f6fbf;stroke-width:1.5}
.card{fill:#ffffff;stroke:#e2e5ed}
.line{stroke:#8c979d;stroke-width:1.5;fill:none}
.lane{stroke:#e2e5ed;stroke-width:1}
.dash{stroke:#5a6a73;stroke-width:1.3;fill:none;stroke-dasharray:5 3}
.odash{stroke:#c15800;stroke-width:1.4;fill:none;stroke-dasharray:5 3}
.frame{fill:none;stroke:#8c979d;stroke-width:1.2;stroke-dasharray:4 3}
.bound{fill:#fbfcfd;stroke:#1f6fbf;stroke-width:1.3;stroke-dasharray:7 4}
.end{fill:#c15800}
.hatch{fill:url(#hatch);stroke:#c15800;stroke-width:1}
.lbl{fill:#1f6fbf;font-weight:600;font-size:11.5px}
.olbl{fill:#c15800;font-weight:600;font-size:11.5px}
</style>
<rect width="1000" height="254" fill="#ffffff"/>
<g transform="translate(10,10)"><rect class="card" width="480" height="234" rx="10"/><text class="title" x="16" y="28">Approval inside the process: one segment</text>

<rect class="new" x="16" y="62" width="430" height="22" rx="4"/>
<text x="24" y="77"><tspan class="head">turn span</tspan><tspan class="mono" dx="8">gen_ai.turn.id=t-7f3a</tspan></text>
<polygon class="end" points="446,64 455,73 446,82 437,73"/>
<rect class="box" x="28" y="92" width="96" height="20" rx="4"/><text class="sub" x="36" y="106">model call</text>
<rect class="box" x="130" y="120" width="244" height="20" rx="4"/><text class="mono" x="138" y="134">execute_tool create_ticket</text>
<rect class="hatch" x="138" y="146" width="150" height="20" rx="3"/><text class="small" x="146" y="160">approval wait</text>
<rect class="box" x="380" y="174" width="62" height="20" rx="4"/><text class="sub" x="388" y="188">model</text>
<path class="line" d="M16 210H446"/><text class="small" x="410" y="226">time →</text>

</g><g transform="translate(510,10)"><rect class="card" width="480" height="234" rx="10"/><text class="title" x="16" y="28">Runtime ended the request: two segments</text>

<rect class="new" x="16" y="62" width="140" height="22" rx="4"/><text class="head" x="24" y="77">segment 1</text>
<polygon class="end" points="156,64 165,73 156,82 147,73"/>
<rect class="box" x="28" y="92" width="110" height="20" rx="4"/><text class="sub" x="36" y="106">model call</text>
<text class="small" x="16" y="132">trace A</text><text class="mono" x="16" y="148">status=requires_action</text>
<path class="dash" d="M170 73H296"/><text class="small" x="176" y="64">no process working</text>
<rect class="new" x="300" y="62" width="150" height="22" rx="4"/><text class="head" x="308" y="77">segment 2</text>
<polygon class="end" points="450,64 459,73 450,82 441,73"/>
<rect class="box" x="308" y="92" width="70" height="20" rx="4"/><text class="sub" x="316" y="106">tool</text>
<rect class="box" x="384" y="120" width="62" height="20" rx="4"/><text class="sub" x="392" y="134">model</text>
<text class="small" x="300" y="160">trace B</text><text class="mono" x="300" y="176">status=completed</text>
<path class="dash" d="M300 84 C 260 120, 200 120, 160 86" marker-end="url(#arr)"/><text class="small" x="208" y="124">span link</text>
<path class="line" d="M16 210H446"/><text class="small" x="410" y="226">time →</text>

</g>
</svg>
